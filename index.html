<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wurzel-Tic-Tac-Toe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=STIX+Two+Text:wght@500&display=swap">
<style>
html{color-scheme:light}
body{margin:0}

/* Layout: Spielbrett wie ein Feld im Karoheft, rechts die Aufgabenkarte; auf dem Handy untereinander */
:root{
  --paper:#f4f7f5; --grid:#dbe4df; --card:#ffffff; --ink:#1c2840; --muted:#5b687d; --line:#c6d1cc;
  --x:#d2462f; --x-bg:#fbe4df; --o:#2457c5; --o-bg:#e1e9fb; --ok:#1f7a4d; --ok-bg:#e1f2e8; --bad-bg:#fbe5e2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-math:"STIX Two Text","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131a22; --grid:#1c2531; --card:#1a2330; --ink:#e8edf6; --muted:#9ba7b9; --line:#2e3a4b;
  --x:#ff7f69; --x-bg:#3d211d; --o:#7fa3ff; --o-bg:#1d2a45; --ok:#5fd19a; --ok-bg:#16352a; --bad-bg:#3b1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131a22; --grid:#1c2531; --card:#1a2330; --ink:#e8edf6; --muted:#9ba7b9; --line:#2e3a4b;
  --x:#ff7f69; --x-bg:#3d211d; --o:#7fa3ff; --o-bg:#1d2a45; --ok:#5fd19a; --ok-bg:#16352a; --bad-bg:#3b1e1c; color-scheme:dark}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:20px 40px;
}
main{max-width:1060px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,44px);margin:0;line-height:1.1;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.sub{color:var(--muted);margin:4px 0 0}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.team.active.tx{border-color:var(--x);background:var(--x-bg)}
.team.active.to{border-color:var(--o);background:var(--o-bg)}
.sym{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;width:1em;text-align:center}
.tx .sym{color:var(--x)} .to .sym{color:var(--o)}
.team input{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);width:9ch;padding:2px 0}
.score{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:right}
.play{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1;max-width:100%}
.cell{position:relative;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;cursor:pointer;padding:6px;min-width:0}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell .task{font-family:var(--f-math);font-size:clamp(17px,2.6vw,26px);text-align:center}
.cell .no{position:absolute;top:6px;left:9px;font-size:12px;color:var(--muted);font-weight:700}
.cell.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--grid)}
.cell.mx{background:var(--x-bg);border-color:var(--x)} .cell.mo{background:var(--o-bg);border-color:var(--o)}
.cell .mark{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,10vw,96px);line-height:1}
.cell.mx .mark{color:var(--x)} .cell.mo .mark{color:var(--o)}
.cell.win{outline:4px solid var(--ok);outline-offset:-4px}
.cell:disabled{cursor:default}
.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.turn{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}
.turn.tx{color:var(--x)} .turn.to{color:var(--o)}
.q{font-family:var(--f-math);font-size:clamp(26px,3.6vw,38px);text-align:center;padding:10px 0}
.qtext{font-size:20px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-family:var(--f-math);font-size:22px;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--x);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:8px;padding:10px 14px;background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left-color:var(--x)}
.fb strong{display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.act{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper)}
button.ghost{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--ink)}
.rules{color:var(--muted);font-size:15px;margin:0}
.rules li{margin-bottom:4px}
.result{font-family:var(--f-display);font-weight:800;font-size:30px;margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--o);outline-offset:2px}
/* Mathe */
.sq{display:inline-flex;align-items:flex-start;white-space:nowrap}
.sq>.r{border-top:.07em solid currentColor;padding:0 .08em;margin-top:.16em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .1em}
.fr>span:first-child{border-bottom:.06em solid currentColor;padding:0 .12em}
@media (prefers-reduced-motion:no-preference){.cell .mark{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.6)}to{transform:none}}}
</style>

</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Wurzel-Tic-Tac-Toe</h1>
      <p class="sub">Mathematik · 2. Klasse · zwei Teams, ein Brett</p>
    </div>
    <div class="teams">
      <div class="team tx" id="teamX"><span class="sym">X</span><input id="nameX" value="Team X" aria-label="Name von Team X"><span class="score" id="scoreX">0</span></div>
      <div class="team to" id="teamO"><span class="sym">O</span><input id="nameO" value="Team O" aria-label="Name von Team O"><span class="score" id="scoreO">0</span></div>
    </div>
  </header>

  <section class="play">
    <div class="board" id="board" aria-label="Spielbrett"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </section>
</main>

<script>
(function(){
const R=x=>`<span class="sq"><span class="s">√</span><span class="r">${x}</span></span>`;
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;

// Aufgabe, richtige Antwort, drei falsche Antworten, kurze Erklärung
const POOL=[
 [R("0.04"),"0.2",["0.02","0.4","2"],"0.2 · 0.2 = 0.04"],
 [R("0.64"),"0.8",["0.08","0.32","8"],"0.8 · 0.8 = 0.64"],
 [R("1.44"),"1.2",["0.12","12","0.72"],"1.2 · 1.2 = 1.44"],
 [R("0.09"),"0.3",["0.03","0.9","3"],"0.3 · 0.3 = 0.09"],
 [R("0.25"),"0.5",["0.05","0.125","5"],"0.5 · 0.5 = 0.25"],
 [R("0.81"),"0.9",["0.09","9","0.81"],"0.9 · 0.9 = 0.81"],
 [R("0.16"),"0.4",["0.04","0.08","4"],"0.4 · 0.4 = 0.16"],
 [R("2.25"),"1.5",["0.15","1.125","15"],"1.5 · 1.5 = 2.25"],
 [R("121"),"11",["12","60.5","21"],"11 · 11 = 121"],
 [R("400"),"20",["200","40","2"],"20 · 20 = 400"],
 [R(F(9,25)),F(3,5),[F(9,25),F(3,25),F(9,5)],`Zähler und Nenner einzeln: ${R(9)} = 3 und ${R(25)} = 5`],
 [R(F(49,16)),F(7,4),[F(49,16),F(7,16),F(4,7)],`${R(49)} = 7 und ${R(16)} = 4`],
 [R(F(4,9)),F(2,3),[F(4,9),F(2,9),F(3,2)],`${R(4)} = 2 und ${R(9)} = 3`],
 [R("9 + 16"),"5",["7",R(7),"25"],`Zuerst addieren: ${R(25)} = 5. Es gibt keine Summenregel.`],
 [R(36)+" + "+R(64),"14",["10","100",R(100)],"6 + 8 = 14"],
 [R(2)+" · "+R(8),"4",[R(10),"16","2"+R(2)],`${R("2 · 8")} = ${R(16)} = 4`],
 [R(3)+" · "+R(3),"3",["9",R(6),"6"],`${R(9)} = 3`],
 [R(5)+" · "+R(20),"10",[R(25),"100","5"+R(2)],`${R(100)} = 10`],
 ["("+R(7)+")²","7",["49",R(7),"14"],"Quadrieren hebt die Wurzel auf."],
 [F(R(72),R(2)),"6",["36",R(70),"3"+R(2)],`${R(F(72,2))} = ${R(36)} = 6`],
 [R(12),"2"+R(3),["3"+R(2),"4"+R(3),"6"],`${R("4 · 3")} = 2${R(3)}`],
 [R(18),"3"+R(2),["2"+R(3),"9"+R(2),"6"],`${R("9 · 2")} = 3${R(2)}`],
 [R(50),"5"+R(2),["2"+R(5),"25"+R(2),"10"],`${R("25 · 2")} = 5${R(2)}`],
 [R(8),"2"+R(2),["4"+R(2),"2"+R(4),"4"],`${R("4 · 2")} = 2${R(2)}`],
 [R(27),"3"+R(3),["9"+R(3),"3"+R(9),"13.5"],`${R("9 · 3")} = 3${R(3)}`],
 ["2"+R(5)+" + 3"+R(5),"5"+R(5),["5"+R(10),"6"+R(5),"25"],`Gleiche Wurzeln zusammenzählen: (2 + 3)${R(5)}`],
 [F("10",R(5)),"2"+R(5),["5"+R(2),"2","10"+R(5)],`Mit ${R(5)} erweitern: ${F("10"+R(5),"5")} = 2${R(5)}`],
 [F("6",R(3)),"2"+R(3),["3"+R(2),"2","6"+R(3)],`Mit ${R(3)} erweitern: ${F("6"+R(3),"3")} = 2${R(3)}`],
 [R("−9"),"nicht definiert",["−3","3","−81"],"Unter der Wurzel darf keine negative Zahl stehen."],
 ["Welche Zahl ist irrational?",R(11),[R(49),"0.25","−"+F(3,4)],"11 ist keine Quadratzahl."]
];

const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);

let S={score:{X:0,O:0},starter:"X"};
function freshGame(){
  const deck=shuffle(POOL.map((_,i)=>i));
  S.cells=Array(9).fill(null);           // "X" | "O" | null
  S.task=deck.slice(0,9);                // Aufgabe pro Feld
  S.spare=deck.slice(9);                 // Ersatz, falls ein Feld falsch beantwortet wird
  S.turn=S.starter; S.sel=null; S.answered=false; S.over=null; S.winLine=null;
  render();
}
const name=t=>($("name"+t).value.trim()||("Team "+t));

function render(){
  $("teamX").classList.toggle("active",!S.over&&S.turn==="X");
  $("teamO").classList.toggle("active",!S.over&&S.turn==="O");
  $("scoreX").textContent=S.score.X; $("scoreO").textContent=S.score.O;
  const b=$("board"); b.innerHTML="";
  S.cells.forEach((m,i)=>{
    const c=document.createElement("button"); c.className="cell"; c.id="cell"+i;
    if(m){c.classList.add(m==="X"?"mx":"mo"); c.innerHTML=`<span class="mark">${m}</span>`; c.disabled=true; c.setAttribute("aria-label",`Feld ${i+1}: ${name(m)}`)}
    else{const t=POOL[S.task[i]]; c.innerHTML=`<span class="no">${i+1}</span><span class="task">${t[0]}</span>`; c.disabled=!!S.over||(S.sel!==null); c.setAttribute("aria-label",`Feld ${i+1} wählen`); c.onclick=()=>choose(i)}
    if(S.sel===i) c.classList.add("sel");
    if(S.winLine&&S.winLine.includes(i)) c.classList.add("win");
    b.appendChild(c);
  });
  renderPanel();
}

function renderPanel(){
  const p=$("panel");
  if(S.over){
    p.innerHTML=`<p class="eyebrow">Spiel beendet</p>
      <p class="result">${S.over==="draw"?"Unentschieden":name(S.over)+" gewinnt!"}</p>
      <p>${S.over==="draw"?"Alle Felder sind belegt, niemand hat drei in einer Reihe.":"Drei Felder in einer Reihe. Der Punkt geht an "+name(S.over)+"."}</p>
      <div class="btns"><button class="act" id="again">Neues Spiel</button><button class="ghost" id="reset">Punkte zurücksetzen</button></div>`;
    $("again").onclick=()=>{S.starter=S.starter==="X"?"O":"X";freshGame()};
    $("reset").onclick=()=>{S.score={X:0,O:0};render()};
    return;
  }
  if(S.sel===null){
    p.innerHTML=`<p class="eyebrow">Am Zug</p>
      <p class="turn t${S.turn.toLowerCase()}">${name(S.turn)} (${S.turn})</p>
      <p>Wählt ein freies Feld auf dem Brett.</p>
      <ul class="rules">
        <li>Richtig gelöst: Das Feld gehört euch.</li>
        <li>Falsch gelöst: Das Feld bleibt frei und erhält eine neue Aufgabe.</li>
        <li>Danach ist das andere Team am Zug. Wer zuerst drei Felder in einer Reihe hat, gewinnt.</li>
        <li>Ohne Taschenrechner rechnen.</li>
      </ul>
      <div class="btns"><button class="ghost" id="restart">Neues Spiel</button></div>`;
    $("restart").onclick=freshGame;
    return;
  }
  const t=POOL[S.task[S.sel]];
  if(!S.order) S.order=shuffle([t[1],...t[2]]);
  const isText=!t[0].includes("sq")&&!t[0].includes("fr");
  p.innerHTML=`<p class="eyebrow">Feld ${S.sel+1} · ${name(S.turn)} (${S.turn})</p>
    <div class="${isText?"qtext":"q"}">${t[0]}${isText?"":" = ?"}</div>
    <div class="opts">${S.order.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}">${o}</button>`).join("")}</div>
    <div id="fb"></div>
    <div class="btns" id="after"><button class="ghost" id="back">Anderes Feld wählen</button></div>`;
  p.querySelectorAll(".opt").forEach(o=>o.onclick=()=>answer(+o.dataset.k));
  $("back").onclick=()=>{S.sel=null;S.order=null;render()};
  p.querySelector(".opt").focus();
}

function choose(i){ if(S.over||S.cells[i])return; S.sel=i; S.order=null; render(); }

function answer(k){
  const i=S.sel,t=POOL[S.task[i]],ok=S.order[k]===t[1];
  // Bei einer falschen Antwort wird die richtige Lösung nicht verraten
  document.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true;if(j===k)o.classList.add(ok?"right":"wrong")});
  $("fb").innerHTML=ok
    ?`<div class="fb"><strong>Richtig! Das Feld gehört ${name(S.turn)}.</strong>${t[3]}</div>`
    :`<div class="fb bad"><strong>Leider falsch. Das Feld bleibt frei.</strong>Es erhält eine neue Aufgabe, und das andere Team ist am Zug.</div>`;
  $("after").innerHTML=`<button class="act" id="next">Weiter</button>`;
  if(ok){ S.cells[i]=S.turn; }
  else{ if(S.spare.length) S.task[i]=S.spare.shift(); }
  // Brett sofort aktualisieren, Panel bleibt mit Rückmeldung stehen
  const c=$("cell"+i);
  if(ok){c.className="cell "+(S.turn==="X"?"mx":"mo");c.innerHTML=`<span class="mark">${S.turn}</span>`}
  $("next").onclick=()=>{
    const w=LINES.find(l=>l.every(j=>S.cells[j]&&S.cells[j]===S.cells[l[0]]));
    if(w){S.over=S.cells[w[0]];S.winLine=w;S.score[S.over]++}
    else if(S.cells.every(Boolean)){S.over="draw"}
    else{S.turn=S.turn==="X"?"O":"X"}
    S.sel=null;S.order=null;render();
  };
  $("next").focus();
}

["nameX","nameO"].forEach(id=>$(id).addEventListener("input",()=>{if(S.sel===null)renderPanel()}));
freshGame();
})();
</script>

</body>
</html>
